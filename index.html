<style>
:root{--bg:#EEF3FB;--c:#fff;--tx:#0F172A;--mu:#64748B;--b:#1D5FD6;--n:#0B1F4D;--g:#F59E0B;--ok:#10B981;--ko:#EF4444;--ln:#E2E8F0;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#070F24;--c:#13213F;--tx:#F1F5F9;--mu:#94A3B8;--ln:#24365C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:auto;min-height:100dvh;overflow:hidden}.scr{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:78px;background:var(--bg)}
.in{animation:in .35s cubic-bezier(.2,.8,.2,1)}.inl{animation:inl .35s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateX(30px)}}@keyframes inl{from{opacity:0;transform:translateX(-30px)}}
.ic{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.hd{background:var(--n);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.ib{background:#ffffff22;border:0;color:#fff;width:36px;height:36px;border-radius:12px;font-size:18px}.bd{padding:14px;flex:1}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0b1f4d10}
.btn{display:block;width:100%;border:0;border-radius:99px;background:var(--b);color:#fff;padding:13px;font-weight:600;font-size:15px;margin:8px 0;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.o{background:var(--c);color:var(--b);border:1.5px solid var(--b)}.btn.g{background:var(--g);color:var(--n)}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--c);color:var(--tx);font-size:15px;margin:4px 0 8px}
h1,h2,h3{margin:8px 0}.mu{color:var(--mu);font-size:13px}.c{text-align:center}.er{color:var(--ko);font-size:13px;min-height:18px}a{color:var(--b);font-weight:700;cursor:pointer}
.big{font-size:54px;color:var(--b)}.scr.dk{background:linear-gradient(170deg,#06122E,#0A3FA0);color:#fff;justify-content:center;align-items:center;text-align:center}.scr.dk .big{color:#fff;animation:pl 2s infinite}@keyframes pl{50%{transform:scale(1.08)}}
.rc{display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:16px;padding:18px;margin:10px 0;cursor:pointer;transition:opacity .4s,transform .15s;box-shadow:0 4px 12px #0b1f4d22}.rc small{display:block;opacity:.8;margin-top:2px}.rc:active{transform:scale(.98)}
.rc.b{background:var(--b);color:#fff}.rc.c{background:var(--c);border:1px solid var(--ln)}.rc.n{background:var(--n);color:#fff}.lock{opacity:.35;pointer-events:none}
.ch{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#1D5FD622;color:var(--b)}.ch.pr{background:var(--b);color:#fff}.ch.ok{background:#10B98122;color:var(--ok)}.ch.ko{background:#EF444422;color:var(--ko)}.ch.wa{background:#F59E0B33;color:#B45309}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button.on{color:var(--b);font-weight:700}.nav .ic{font-size:20px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ct{text-align:center}.ct .n{font-size:28px;font-weight:700;color:var(--b)}
.hero{background:var(--n);color:#fff}.av{width:42px;height:42px;border-radius:50%;background:var(--g);color:var(--n);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.qrb{width:210px;margin:10px auto;background:#fff;padding:6px;border-radius:12px;min-height:60px}.qrb svg{width:100%;height:auto;display:block}.qrc{text-align:center;background:linear-gradient(135deg,#0B1F4D,#1D5FD6);color:#fff}.qrc .mu{color:#cbd5e1}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.chs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chs .ch{cursor:pointer;padding:6px 12px}.chs .ch.on{background:var(--b);color:#fff}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#111;height:280px}.cam video{width:100%;height:100%;object-fit:cover}.fr{position:absolute;inset:50px;border:3px solid #38BDF8;border-radius:22px;overflow:hidden}.fr i{position:absolute;left:6px;right:6px;height:3px;background:#38BDF8;box-shadow:0 0 12px #38BDF8;animation:sc 1.8s ease-in-out infinite alternate}@keyframes sc{from{top:5%}to{top:92%}}
.fb{border-radius:16px;padding:14px;margin-top:10px;font-weight:700;animation:in .3s}.fb.ok{background:#10B98122;color:var(--ok)}.fb.wa{background:#F59E0B33;color:#B45309}.fb.ko{background:#EF444422;color:var(--ko)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}.row{flex-wrap:wrap}.ch a{margin-left:4px}.logo{min-height:44dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top)}.lg{font-size:min(36vw,150px);color:var(--b);line-height:1;animation:lg .7s cubic-bezier(.2,.8,.2,1)}.logo h1{font-size:clamp(32px,10vw,48px);margin:14px 0 0}.logo .ch.pr{font-size:clamp(13px,3.6vw,18px);padding:4px 12px;vertical-align:middle}@keyframes lg{from{opacity:0;transform:scale(.7)}}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-church" viewBox="0 0 24 24"><path d="M12 2v5M9.5 4.5h5M12 7 6 11v10h12V11z"/><path d="M10 21v-5h4v5M2 21h20"/></symbol>

<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M16 7l3 3"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 13.5h.01"/></symbol>

</defs></svg>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
/* ---------- Données (stockées sur le téléphone) ---------- */
let D={space:null,sess:null,workers:[],programs:[],codes:[],att:[],pin:null,key:null,mins:[],pay:[],church:{name:'Mon Église'}};
try{Object.assign(D,JSON.parse(localStorage.getItem('gep')||'{}'))}catch(e){}
if(!D.key)D.key=rnd(32);D.workers.forEach(w=>{if(!w.mis)w.mis=w.mi?[w.mi]:[]});
const save=()=>{try{localStorage.setItem('gep',JSON.stringify(D))}catch(e){}};save();
/* ---------- Sécurité : PIN (PBKDF2) et QR signé (HMAC) ---------- */
async function pbk(pin,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:120000},k,256))}
async function sig(id){const k=await crypto.subtle.importKey('raw',enc.encode(D.key),{name:'HMAC',hash:'SHA-256'},false,['sign']);return hex(await crypto.subtle.sign('HMAC',k,enc.encode(id))).slice(0,10)}
async function qrTo(sel,id){const el=$(sel);if(!el)return;if(!window.qrcode){el.textContent='QR indisponible : ouvrez l’app une fois en ligne.';return}const q=qrcode(0,'M');q.addData(id+'|'+await sig(id));q.make();el.innerHTML=q.createSvgTag(5,2)}
/* ---------- Constantes et aides ---------- */
const MIN=['Chorale / Louange','Protocole & Accueil','Évangélisation','Multimédia / Sonorisation','École du Dimanche','Intercession'],RESP=['Membre actif','Diacre','Responsable de département','Pasteur'];
const ST={ACTIF:'Actif',INACTIF:'Inactif',EN_CONGE:'En congé'},SC={ACTIF:'ok',INACTIF:'ko',EN_CONGE:'wa'},SPN={w:'Ouvrier / Ouvrière',a:'Administrateur',s:'Super Admin'};
const nm=w=>esc(w.fn+' '+w.ln),ini=w=>esc((w.fn[0]+w.ln[0]).toUpperCase()),me=()=>D.sess&&D.workers.find(x=>x.id===D.sess.id);
const dt=ms=>new Date(ms).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const hd=(t,b=1)=>`<div class="hd">${b?`<button class="ib" data-a="back">${I('back')}</button>`:''}<span style="flex:1">${t}</span></div>`;
const nav=(it,cur,a)=>`<div class="nav">${it.map(([k,l,i])=>`<button class="${k===cur?'on':''}" data-a="${a}" data-k="${k}">${I(i)}<span>${l}</span></button>`).join('')}</div>`;
const codeOK=c=>{const x=D.codes.find(k=>k.c===c);return !!x&&!x.rev&&(!x.exp||Date.now()<=x.exp)};
const cs=c=>c.rev?['Révoqué','ko']:(c.exp&&Date.now()>c.exp)?['Expiré','wa']:(c.max&&c.u>=c.max)?['Épuisé','wa']:['Actif','ok'];
/* ---------- Navigation ---------- */
let V='splash',H=[],T={},DIR='r',DP=null,cam=null,L={raw:'',t:0},tries=0,lockUntil=0;
function go(v,o={}){stopCam();if(!o.back&&!o.rep&&V!==v){H.push(V);history.pushState({},'')}DIR=o.back?'l':'r';V=v;if(o.t)Object.assign(T,o.t);draw()}
function reset(v,t={}){H=[];T=t;DIR='r';V=v;draw()}
function back(){const p=H.pop();if(p)go(p,{back:1})}
addEventListener('popstate',()=>{if(H.length)back();else history.pushState({},'')});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(V==='role')draw()});
function draw(){app.innerHTML=VIEWS[V]();const e=app.firstElementChild;e.classList.add(DIR==='l'?'inl':'in');
 if(V==='whome'&&(T.wt||'qr')==='qr'){const w=me();w&&qrTo('#qr',w.id)}if(V==='ahome'&&T.at==='scan')startCam()}
function toast(m){document.body.insertAdjacentHTML('beforeend',`<div class="fb ok" id="ts" style="position:fixed;left:16px;right:16px;bottom:90px;max-width:448px;margin:auto;z-index:20;background:var(--n);color:#fff">${esc(m)}</div>`);setTimeout(()=>{const t=$('#ts');t&&t.remove()},2600)}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="mod"><div class="card c" style="width:100%;max-width:360px">${h}<button class="btn o" data-a="x">Fermer</button></div></div>`)}
/* ---------- Caméra et pointage ---------- */
function fb(k,t,s){const e=$('#fb');if(e){e.innerHTML=`<div class="fb ${k}">${esc(t)}<div style="font-weight:400">${esc(s)}</div></div>`;setTimeout(()=>{const f=$('#fb');f&&(f.innerHTML='')},2800)}try{navigator.vibrate&&navigator.vibrate(k==='ok'?60:[60,40,60])}catch(e){}}
async function onQR(raw){if(raw===L.raw&&Date.now()-L.t<3000)return;L.raw=raw;L.t=Date.now();const[id,s]=raw.split('|');
 if(!id||!s||s!==await sig(id))return fb('ko','QR invalide','Ce badge n’est pas reconnu');const w=D.workers.find(x=>x.id===id);if(!w)return fb('ko','QR invalide','Ouvrier introuvable');
 if(w.st==='INACTIF')return fb('ko',w.fn+' '+w.ln,'Compte inactif — présence refusée');const p=D.programs.find(x=>x.act);if(!p)return fb('ko','Aucun programme actif','Activez un programme avant de scanner');
 if(D.att.some(a=>a.p===p.id&&a.w===id))return fb('wa',w.fn+' '+w.ln,'Déjà pointé pour ce programme');
 const late=Date.now()>p.at+15*60000;D.att.push({p:p.id,w:id,st:late?'LATE':'PRESENT',t:Date.now()});save();fb(late?'wa':'ok',w.fn+' '+w.ln,late?'En retard — présence enregistrée':'Présent — présence enregistrée')}
async function startCam(){const m=$('#cm');if(!navigator.mediaDevices||!window.jsQR){m.textContent='Caméra ou lecteur QR indisponible (HTTPS et connexion initiale requis).';return}
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#vid');if(!v){st.getTracks().forEach(t=>t.stop());return}v.srcObject=st;await v.play();cam={st,run:true};
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 (function tick(){if(!cam||!cam.run)return;if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&r.data)onQR(r.data)}setTimeout(tick,200)})()}
 catch(e){m.textContent='Autorisez l’accès à la caméra pour scanner.'}}
function stopCam(){if(cam){cam.run=false;cam.st.getTracks().forEach(t=>t.stop());cam=null}}
/* ---------- Vues ---------- */
const prof=w=>[['Identifiant',w.id],['Téléphone',w.ph],['Adresse',w.ad||'—'],['Email',w.em||'—'],['Genre',w.ge==='F'?'Femme':'Homme'],['Responsabilité',w.rs],['Ministères',mn(w)],['Baptême',w.by||'—'],['Statut',ST[w.st]]].map(([k,v])=>`<div class="card row" style="padding:10px 14px"><span class="mu" style="flex:1">${k}</span><b>${esc(v)}</b></div>`).join('');
const progList=adm=>[...D.programs].sort((a,b)=>b.at-a.at).map(p=>`<div class="card row"><div style="flex:1"><b>${esc(p.t)}</b><div class="mu">${esc(p.ty)} · ${dt(p.at)}${p.pl?' · '+esc(p.pl):''}</div></div>${p.act?'<span class="ch ok">EN COURS</span>':''}${adm?`<div style="display:flex;flex-direction:column;gap:4px;text-align:right">${p.act?'':`<a data-a="actv" data-id="${p.id}">Activer</a>`}<a data-a="newp" data-id="${p.id}">Modifier</a><a data-a="delp" data-id="${p.id}" style="color:var(--ko)">Supprimer</a></div>`:''}</div>`).join('')||'<p class="mu c">Aucun programme pour le moment.</p>';
const wl=()=>{const q=(T.q||'').toLowerCase(),f=T.f||'TOUS';return D.workers.filter(w=>(f==='TOUS'||w.st===f)&&(!q||(w.fn+' '+w.ln+' '+w.id+' '+w.ph).toLowerCase().includes(q))).map(w=>`<div class="card"><div class="row"><div class="av">${ini(w)}</div><div style="flex:1"><b>${nm(w)}</b><div class="mu">${w.id} · ${esc(w.rs)}</div></div><span class="ch ${SC[w.st]}">${ST[w.st]}</span></div><div class="row" style="margin-top:8px;gap:12px"><select data-c="st" data-id="${w.id}" style="margin:0">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===w.st?' selected':''}>${v}</option>`).join('')}</select><a data-a="card" data-id="${w.id}">Carte</a><a data-a="exc" data-id="${w.id}">Excusé</a><a data-a="editp" data-id="${w.id}">Modifier</a><a data-a="delw" data-id="${w.id}" style="color:var(--ko)">Suppr.</a></div></div>`).join('')||'<p class="mu c">Aucun ouvrier trouvé.</p>'};
const mn=w=>(w.mis||[]).join(', ')||'—',mn0=w=>(w.mis||[]).join(' · ')||'Aucun ministère',allMin=()=>[...new Set([...MIN,...D.mins])];
const addMin=m=>{if(m&&!allMin().some(x=>x.toLowerCase()===m.toLowerCase())){D.mins.push(m)}};
const mchips=()=>(T.rm||[]).map((m,i)=>`<span class="ch">${esc(m)} <a data-a="delm" data-i="${i}">×</a></span>`).join('')||'<span class="mu">Aucun ministère ajouté</span>';
const addRm=m=>{T.rm=T.rm||[];if(m&&!T.rm.some(x=>x.toLowerCase()===m.toLowerCase()))T.rm.push(m);const e=$('#mch');e&&(e.innerHTML=mchips())};
const lt=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fc=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' FCFA';
const paid=c=>c.pm.reduce((s,p)=>s+p.a,0);
const mField=()=>`<div class="card" style="padding:10px;text-align:left"><b>Ministère d’appartenance</b><div id="mch" class="chs">${mchips()}</div><select id="mi" data-c="msel"><option value="">Choisir un ministère…</option>${allMin().map(m=>`<option>${esc(m)}</option>`).join('')}</select><div class="row"><input id="mn" placeholder="Ou ajoutez-en un manuellement" style="margin:0;flex:1"><button class="btn" style="width:56px;margin:0" data-a="addm">${I('plus')}</button></div></div>`;
const rField=v=>`<input id="rs" list="rl" value="${esc(v)}" placeholder="Responsabilité dans l’église"><datalist id="rl">${RESP.map(m=>`<option>${m}</option>`).join('')}</datalist>`;
const minCard=()=>`<div class="card"><b>Ministères</b><div class="chs">${allMin().map(m=>`<span class="ch">${esc(m)} (${D.workers.filter(w=>(w.mis||[]).includes(m)).length})</span>`).join('')}</div><div class="row"><input id="gm" placeholder="Nouveau ministère" style="margin:0;flex:1"><button class="btn" style="width:56px;margin:0" data-a="addgm">${I('plus')}</button></div></div>`;
const setCard=()=>`<div class="card"><b>Paramètres de l’église</b><input id="cn" value="${esc(D.church.name)}" placeholder="Nom officiel"><button class="btn o" data-a="savec">Enregistrer le nom</button><div class="row"><button class="btn o" style="flex:1" data-a="exp">Sauvegarder</button><button class="btn o" style="flex:1" data-a="imp">Restaurer</button></div><input id="fi" type="file" accept=".json" hidden></div>`;
